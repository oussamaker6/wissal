<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جميلة نوفمبر 🎀</title>
    <!-- خط عربي جميل من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- مكتبة Confetti للألعاب النارية -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --pink-main: #ff75a0;
            --pink-light: #ffb6c1;
            --pink-bg: #fff0f5;
            --pink-dark: #d81b60;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--pink-bg);
            background-image: radial-gradient(#ffc0cb 1px, transparent 1px);
            background-size: 20px 20px;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 117, 160, 0.25);
            border: 4px solid var(--pink-light);
            padding: 30px 20px;
            text-align: center;
            position: relative;
            transition: all 0.5s ease;
        }

        .page {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.6s ease-in-out;
        }

        .page.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* زينة الورود */
        .decorations {
            font-size: 24px;
            margin-bottom: 5px;
        }

        /* صورة هيلو كيتي المحلية الخاصة بك (kitty.png) */
        /* هذه الصورة ستظهر في كل الصفحات */
        .kitty-img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            margin: 10px 0;
            filter: drop-shadow(0 5px 8px rgba(255, 117, 160, 0.3));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* الخط العربي الفاخر */
        .arabic-title {
            font-family: 'Amiri', serif;
            font-size: 38px;
            font-weight: 700;
            color: var(--pink-dark);
            margin: 10px 0;
            text-shadow: 2px 2px 4px rgba(255, 182, 193, 0.5);
        }

        /* زر أبعاد 3D */
        .btn-3d {
            background-color: var(--pink-main);
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 14px 32px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #d81b60, 0 10px 15px rgba(0,0,0,0.15);
            transition: all 0.1s ease;
            margin-top: 15px;
            outline: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-3d:hover {
            background-color: #ff5c8d;
        }

        .btn-3d:active {
            box-shadow: 0 2px 0 #d81b60, 0 4px 6px rgba(0,0,0,0.15);
            transform: translateY(4px);
        }

        /* مدخلات اللغز */
        .puzzle-box {
            width: 100%;
            margin: 15px 0;
        }

        .question-text {
            font-size: 19px;
            font-weight: 600;
            color: #444;
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .puzzle-input {
            width: 80%;
            padding: 12px 20px;
            font-size: 18px;
            border: 2px solid var(--pink-light);
            border-radius: 25px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 8px;
        }

        .puzzle-input:focus {
            border-color: var(--pink-main);
        }

        .error-msg {
            color: #e91e63;
            font-size: 14px;
            margin-top: 5px;
            min-height: 20px;
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
